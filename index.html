<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpendScope | CodePixel</title><link rel="stylesheet" href="style.css"></head><body><header>SPENDSCOPE<span>.</span><small>CODEPIXEL LAB / 01</small></header><main><p class="eyebrow">PERSONAL FINANCE · LOCAL DEMO</p><h1>Know where<br><span>your money goes.</span></h1><p class="muted">Track expenses. Your entries stay in this browser.</p><section class="stats"><article><small>TOTAL SPENT</small><strong id="total">KSh 0.00</strong></article><article><small>TRANSACTIONS</small><strong id="count">0</strong></article><article><small>TOP CATEGORY</small><strong id="top">—</strong></article></section><section class="panel"><h2>Add expense</h2><form id="form"><label>Description<input id="desc" required maxlength="70" placeholder="Lunch"></label><div class="two"><label>Amount (KSh)<input id="amount" type="number" min=".01" step=".01" required placeholder="250"></label><label>Category<select id="category"><option>Food</option><option>Transport</option><option>School</option><option>Data & airtime</option><option>Shopping</option><option>Other</option></select></label></div><label>Date<input id="date" type="date" required></label><button>Save expense +</button></form></section><section class="panel"><div class="listhead"><h2>Recent expenses</h2><button id="clear" class="ghost" type="button">Clear all</button></div><div id="list"></div></section><footer>HTML · CSS · JavaScript · localStorage</footer></main><script src="app.js"></script></body></html>
